name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check + lint
        run: npm run lint
      - name: Tests
        run: npm test
        env:
          DATA_BACKEND: legacy
      - name: Build
        run: npm run build
