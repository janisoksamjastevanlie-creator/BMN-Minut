<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagram Alur Sistem BMN-Minut</title>
  <style>
    * { box-sizing: border-box; }
    @page {
      size: A4 landscape;
      margin: 5mm;
      @bottom-right {
        content: "Alur sistem BMN-Minut · Halaman " counter(page) " / " counter(pages);
        color: #536477;
        font: 8pt Arial, sans-serif;
      }
    }
    html, body { margin: 0; background: #f2f6fb; color: #173a62; font-family: Arial, sans-serif; }
    main { width: 100%; }
    img { display: block; width: 100%; height: auto; max-height: 195mm; object-fit: contain; }
    @media screen { main { max-width: 1200px; margin: 24px auto; padding: 12px; background: white; box-shadow: 0 10px 35px #102f5030; } }
  </style>
</head>
<body>
  <main>
    <img src="Diagram%20Alur%20Sistem%20BMN-Minut.svg" alt="Diagram alur akses, permohonan, penerimaan persediaan, dan dokumentasi BMN-Minut">
  </main>
</body>
</html>
