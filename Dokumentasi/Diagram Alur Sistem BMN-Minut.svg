<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Diagram Alur Sistem BMN-Minut</title>
  <desc id="description">Alur akses aplikasi, permohonan barang dan penerimaan stok, barang masuk, serta pengarsipan dokumen.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2f78bd"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#23845f"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #123967; }
      .top-title { fill: #fff; }
      .subtitle { font: 18px Arial, sans-serif; fill: #d5e8fa; }
      .section { font: 700 22px Arial, sans-serif; fill: #123967; }
      .heading { font: 700 17px Arial, sans-serif; fill: #173a62; }
      .body { font: 15px Arial, sans-serif; fill: #41566e; }
      .small { font: 14px Arial, sans-serif; fill: #53687d; }
      .card { fill: #fff; stroke: #c9d9ea; stroke-width: 2; }
      .blue { fill: #eaf3fc; stroke: #4d8dc5; stroke-width: 2; }
      .green { fill: #edf8f1; stroke: #48a27b; stroke-width: 2; }
      .amber { fill: #fff7e7; stroke: #d59a2b; stroke-width: 2; }
      .red { fill: #fff0ef; stroke: #ce6862; stroke-width: 2; }
      .arrow { fill: none; stroke: #2f78bd; stroke-width: 3; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #23845f; stroke-width: 3; marker-end: url(#arrow-green); }
      .number { font: 700 16px Arial, sans-serif; fill: #fff; }
      .pill { font: 700 13px Arial, sans-serif; fill: #123967; }
      .top-pill { fill: #fff; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f2f6fb"/>
  <rect x="0" y="0" width="1600" height="142" fill="#123967"/>
  <rect x="0" y="138" width="1600" height="8" fill="#2f83c5"/>
  <text x="64" y="64" class="title top-title">ALUR SISTEM BMN-MINUT</text>
  <text x="66" y="105" class="subtitle" fill="#d5e8fa">Panduan alur berbasis kode sumber aplikasi yang ditinjau pada 18 Oktober 2026</text>
  <rect x="1290" y="42" width="245" height="54" rx="18" fill="#1d4f83"/>
  <text x="1412" y="75" text-anchor="middle" class="pill top-pill">BPS KAB. MINAHASA UTARA</text>

  <rect x="48" y="174" width="1504" height="210" rx="22" class="card"/>
  <text x="78" y="214" class="section">1. Akses dan navigasi berbasis peran</text>
  <g>
    <rect x="80" y="244" width="205" height="90" rx="15" class="blue"/>
    <circle cx="106" cy="269" r="16" fill="#2f78bd"/><text x="106" y="275" text-anchor="middle" class="number">1</text>
    <text x="132" y="273" class="heading">Buka website</text>
    <text x="98" y="305" class="body">bmnbpsminut.online</text>

    <path d="M290 289 H328" class="arrow"/>
    <rect x="340" y="244" width="205" height="90" rx="15" class="blue"/>
    <circle cx="366" cy="269" r="16" fill="#2f78bd"/><text x="366" y="275" text-anchor="middle" class="number">2</text>
    <text x="392" y="273" class="heading">Masuk</text>
    <text x="358" y="305" class="body">NIP/username + sandi</text>

    <path d="M550 289 H588" class="arrow"/>
    <rect x="600" y="244" width="218" height="90" rx="15" class="amber"/>
    <circle cx="626" cy="269" r="16" fill="#bd8118"/><text x="626" y="275" text-anchor="middle" class="number">3</text>
    <text x="652" y="273" class="heading">Validasi server</text>
    <text x="618" y="305" class="body">Akun dan izin diperiksa</text>

    <path d="M823 289 H861" class="arrow"/>
    <rect x="873" y="244" width="205" height="90" rx="15" class="blue"/>
    <circle cx="899" cy="269" r="16" fill="#2f78bd"/><text x="899" y="275" text-anchor="middle" class="number">4</text>
    <text x="925" y="273" class="heading">Beranda</text>
    <text x="891" y="305" class="body">Dashboard sesuai peran</text>

    <path d="M1083 289 H1121" class="arrow"/>
    <rect x="1133" y="244" width="184" height="90" rx="15" class="blue"/>
    <circle cx="1159" cy="269" r="16" fill="#2f78bd"/><text x="1159" y="275" text-anchor="middle" class="number">5</text>
    <text x="1185" y="273" class="heading">Pilih menu</text>
    <text x="1151" y="305" class="body">Sesuai kewenangan</text>

    <path d="M1322 289 H1360" class="arrow"/>
    <rect x="1372" y="244" width="148" height="90" rx="15" class="green"/>
    <text x="1446" y="277" text-anchor="middle" class="heading">Catat</text>
    <text x="1446" y="304" text-anchor="middle" class="body">dan pantau</text>
  </g>
  <text x="82" y="361" class="small">Jika akun tidak valid, pengguna tetap di halaman masuk. Menu yang terlihat mengikuti izin akun; sesi maksimum yang ditampilkan aplikasi adalah 12 jam.</text>

  <rect x="48" y="408" width="1504" height="302" rx="22" class="card"/>
  <text x="78" y="449" class="section">2. Permohonan barang dan konfirmasi penerimaan</text>
  <g>
    <rect x="78" y="482" width="176" height="103" rx="15" class="blue"/>
    <text x="166" y="512" text-anchor="middle" class="heading">Pemohon</text>
    <text x="166" y="539" text-anchor="middle" class="body">Pilih barang &amp;</text>
    <text x="166" y="562" text-anchor="middle" class="body">jumlah tersedia</text>
    <text x="166" y="579" text-anchor="middle" class="pill">Diajukan</text>

    <path d="M260 534 H292" class="arrow"/>
    <rect x="304" y="482" width="178" height="103" rx="15" class="blue"/>
    <text x="393" y="512" text-anchor="middle" class="heading">Pemeriksaan</text>
    <text x="393" y="539" text-anchor="middle" class="body">Operator berizin</text>
    <text x="393" y="562" text-anchor="middle" class="body">menilai permohonan</text>
    <text x="393" y="579" text-anchor="middle" class="pill">Diverifikasi</text>

    <path d="M488 534 H520" class="arrow"/>
    <rect x="532" y="482" width="178" height="103" rx="15" class="amber"/>
    <text x="621" y="512" text-anchor="middle" class="heading">Keputusan</text>
    <text x="621" y="539" text-anchor="middle" class="body">Role persetujuan</text>
    <text x="621" y="562" text-anchor="middle" class="body">menyetujui / menolak</text>
    <text x="621" y="579" text-anchor="middle" class="pill">Disetujui / Ditolak</text>

    <path d="M716 534 H748" class="arrow"/>
    <rect x="760" y="482" width="178" height="103" rx="15" class="blue"/>
    <text x="849" y="512" text-anchor="middle" class="heading">Penyiapan</text>
    <text x="849" y="539" text-anchor="middle" class="body">Petugas berizin</text>
    <text x="849" y="562" text-anchor="middle" class="body">menyiapkan barang</text>
    <text x="849" y="579" text-anchor="middle" class="pill">Diproses</text>

    <path d="M944 534 H976" class="arrow"/>
    <rect x="988" y="482" width="178" height="103" rx="15" class="amber"/>
    <text x="1077" y="512" text-anchor="middle" class="heading">Serah terima</text>
    <text x="1077" y="539" text-anchor="middle" class="body">Jumlah diserahkan</text>
    <text x="1077" y="562" text-anchor="middle" class="body">dicatat petugas</text>
    <text x="1077" y="579" text-anchor="middle" class="pill">Menunggu Konfirmasi</text>

    <path d="M1172 534 H1204" class="arrow"/>
    <rect x="1216" y="482" width="178" height="103" rx="15" class="green"/>
    <text x="1305" y="512" text-anchor="middle" class="heading">Pemohon</text>
    <text x="1305" y="539" text-anchor="middle" class="body">Periksa barang fisik</text>
    <text x="1305" y="562" text-anchor="middle" class="body">lalu konfirmasi</text>
    <text x="1305" y="579" text-anchor="middle" class="pill">Diterima</text>

    <path d="M1400 534 H1432" class="arrow-green"/>
    <rect x="1444" y="482" width="78" height="103" rx="15" class="green"/>
    <text x="1483" y="527" text-anchor="middle" class="heading">Stok</text>
    <text x="1483" y="554" text-anchor="middle" class="body">keluar</text>
  </g>
  <rect x="80" y="612" width="1440" height="66" rx="13" class="red"/>
  <text x="100" y="639" class="body">Catatan pengaman: jumlah wajib bilangan bulat positif dan tidak melebihi stok tersedia; barang bersaldo 0 tidak dapat diminta.</text>
  <text x="100" y="661" class="small">Pada kode saat ini, akun ber-role Pimpinan memantau permohonan tetapi dikecualikan dari tindakan persetujuan di alur ini. Hanya pemilik permohonan yang boleh mengonfirmasi penerimaannya.</text>

  <rect x="48" y="734" width="730" height="302" rx="22" class="card"/>
  <text x="78" y="775" class="section">3. Barang masuk gudang</text>
  <g>
    <rect x="80" y="805" width="152" height="82" rx="14" class="blue"/>
    <text x="156" y="836" text-anchor="middle" class="heading">Catat</text>
    <text x="156" y="862" text-anchor="middle" class="body">menunggu periksa</text>
    <path d="M238 846 H268" class="arrow"/>
    <rect x="280" y="805" width="152" height="82" rx="14" class="amber"/>
    <text x="356" y="836" text-anchor="middle" class="heading">Periksa</text>
    <text x="356" y="862" text-anchor="middle" class="body">fisik &amp; dokumen</text>
    <path d="M438 846 H468" class="arrow"/>
    <rect x="480" y="805" width="128" height="82" rx="14" class="blue"/>
    <text x="544" y="836" text-anchor="middle" class="heading">Verifikasi</text>
    <text x="544" y="862" text-anchor="middle" class="body">terima/tolak</text>
    <path d="M613 846 H638 V819 H658" class="arrow-green"/>
    <rect x="660" y="798" width="94" height="61" rx="13" class="green"/>
    <text x="707" y="823" text-anchor="middle" class="heading">Diterima</text>
    <text x="707" y="845" text-anchor="middle" class="small">stok bertambah</text>
    <path d="M613 846 H638 V887 H658" class="arrow"/>
    <rect x="660" y="867" width="94" height="54" rx="13" class="red"/>
    <text x="707" y="900" text-anchor="middle" class="heading">Ditolak</text>
  </g>
  <text x="82" y="948" class="small">Stok belum berubah saat transaksi baru dicatat.</text>
  <text x="82" y="972" class="small">Penolakan atau kondisi pemeriksaan tidak sesuai tidak menambah saldo.</text>
  <text x="82" y="1006" class="small">Status: Menunggu Pemeriksaan → Sudah Diperiksa → Diverifikasi / Ditolak.</text>

  <rect x="798" y="734" width="754" height="302" rx="22" class="card"/>
  <text x="828" y="775" class="section">4. Dokumen, arsip, dan laporan</text>
  <g>
    <rect x="830" y="805" width="170" height="82" rx="14" class="blue"/>
    <text x="915" y="836" text-anchor="middle" class="heading">Pilih berkas</text>
    <text x="915" y="862" text-anchor="middle" class="body">PDF / gambar*</text>
    <path d="M1005 846 H1040" class="arrow"/>
    <rect x="1052" y="805" width="170" height="82" rx="14" class="amber"/>
    <text x="1137" y="836" text-anchor="middle" class="heading">Isi metadata</text>
    <text x="1137" y="862" text-anchor="middle" class="body">nomor, tanggal, jenis</text>
    <path d="M1227 846 H1262" class="arrow"/>
    <rect x="1274" y="805" width="170" height="82" rx="14" class="green"/>
    <text x="1359" y="836" text-anchor="middle" class="heading">Simpan arsip</text>
    <text x="1359" y="862" text-anchor="middle" class="body">sesuai izin akun</text>
    <path d="M1449 846 H1484" class="arrow"/>
    <rect x="1496" y="805" width="42" height="82" rx="12" fill="#edf8f1" stroke="#48a27b" stroke-width="2"/>
    <text x="1517" y="853" text-anchor="middle" class="small">Cari</text>
  </g>
  <text x="832" y="930" class="small">Nota: pemilihan barang, jumlah, satuan, harga, vendor dan total; akses rincian nilai dibatasi role.</text>
  <text x="832" y="955" class="small">Draft dapat diedit pengelola; Final bukan bukti tanda tangan elektronik resmi.</text>
  <text x="832" y="980" class="small">Penyimpanan, provider WhatsApp/AI, dan layar setelah login perlu verifikasi deployment.</text>
  <text x="832" y="1010" class="small">*Batas berkas mengikuti validasi backend dan konfigurasi hosting yang aktif.</text>

  <text x="800" y="1080" text-anchor="middle" class="small">Alur dan hak akses mengikuti implementasi yang ditinjau; sesuaikan keputusan administrasi dengan SOP resmi instansi.</text>
</svg>
