# Catatan: file ini diproses `sed` oleh deploy/setup-vps.sh untuk mengganti __DOMAIN__.
# Timeout di bawah harus lebih besar dari batas waktu internal aplikasi
# (STATE_REQUEST_TIMEOUT_MS=105s) supaya pengguna melihat pesan kesalahan dari server,
# bukan potongan koneksi dari nginx yang tampak sebagai "server tidak merespon".
upstream bmn_minut_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 30m;
    client_body_timeout 120s;

    # Sinkronisasi state berukuran megabyte; kompresi mempercepat muat halaman
    # dan mengurangi waktu koneksi di jaringan kantor.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain text/html;

    # Pemeriksaan kesehatan dan heartbeat tidak boleh ikut menahan antrean.
    location = /api/health {
        proxy_pass http://bmn_minut_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        access_log off;
    }

    # Penyimpanan state whole-application: batas waktu panjang tetapi tetap terbatas.
    location = /api/state {
        proxy_pass http://bmn_minut_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://bmn_minut_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}
