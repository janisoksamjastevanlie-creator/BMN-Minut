      // Terapkan tema sebelum halaman digambar agar tidak ada kedipan warna.
      // Default: tema siang. Tema malam hanya dipakai bila pengguna memilihnya.
      (function () {
        try {
          var stored = window.localStorage.getItem('bmn-theme-v2');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
